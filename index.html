<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#16302a" />
<title>Freshman Map — CYCU</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />
<link href="./styles.css" rel="stylesheet" />
</head>
<body>

<div class="screen on" id="s-map">
  <div id="map"></div>
  <div class="hud topbar">
    <div class="badge">
      <div class="avatar">🐣</div>
      <div><div class="lvl">Lv 3 <small data-i18n="surviving"></small></div><div class="xpbar"><i></i></div></div>
    </div>
    <div class="spacer"></div>
    <select class="lang-select" id="language" data-i18n-aria="language">
      <option value="zh-Hant">繁中</option>
      <option value="en">EN</option>
      <option value="ja">日本語</option>
    </select>
    <button class="iconbtn add" id="addpin" data-i18n-title="addPlace">➕</button>
    <button class="iconbtn sos" id="sos" data-i18n-title="sosTitle">🧻</button>
    <button class="iconbtn" id="recenter" data-i18n-title="recenterTitle">🎯</button>
  </div>
  <div class="hud category-menu" id="chips"></div>
</div>

<div class="screen" id="s-food">
  <div class="scroll">
    <div class="h1"><span data-i18n="foodTitle"></span><small data-i18n="foodSubtitle"></small></div>
    <div class="explore-tabs" id="explore-tabs" role="tablist"></div>
    <div class="place-filters" id="fchips"></div>
    <div id="flist"></div>
  </div>
</div>

<div class="screen" id="s-buddy">
  <div class="scroll">
    <div class="h1">BuddyUp<small data-i18n="buddySubtitle"></small></div>
    <div class="reminder" id="breminder" hidden></div>
    <div class="createbox" id="bcreate" hidden></div>
    <div class="chatbox" id="bchat" hidden></div>
    <div id="blist"></div>
    <button class="btn ghost wide" id="newact">➕ <span data-i18n="newActivity"></span></button>
  </div>
</div>

<div class="screen" id="s-me">
  <div class="scroll"></div>
</div>

<div class="login" id="login" hidden></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<nav class="nav">
  <button class="on" data-screen="s-map"><span class="nav-icon">🗺️</span><span class="nav-label" data-i18n="navMap"></span></button>
  <button data-screen="s-food"><span class="nav-icon">🧭</span><span class="nav-label" data-i18n="navFood"></span></button>
  <button data-screen="s-buddy"><span class="nav-icon">🤝</span><span class="nav-label" data-i18n="navBuddy"></span></button>
  <button data-screen="s-me"><span class="nav-icon">🐣</span><span class="nav-label" data-i18n="navMe"></span></button>
</nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
  import { initMap, resizeMap } from './src/map.js'
  import { initFood } from './src/food.js'
  import { initBuddy } from './src/buddy.js'
  import { initProfile, render as renderProfile } from './src/profile.js'
  import { campus, usingMock } from './src/api.js'
  import { initLogin, wireSignOut } from './src/login.js'
  import { applyTranslations, getLanguage, localName, onLanguageChange, setLanguage, t } from './src/i18n.js'
  import { closeSheet } from './src/ui.js'

  const language = document.getElementById('language')
  const translatePage = () => {
    applyTranslations()
    language.value = getLanguage()
    document.title = t('appTitle', { campus: localName(campus) })
  }
  language.onchange = () => setLanguage(language.value)
  onLanguageChange(translatePage)
  translatePage()

  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'))
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'))
    b.classList.add('on')
    document.getElementById(b.dataset.screen).classList.add('on')
    closeSheet()
    if (b.dataset.screen === 's-map') setTimeout(resizeMap, 50)
    if (b.dataset.screen === 's-me') renderProfile()
  })

  await initLogin()
  initMap(); initFood(); initBuddy(); initProfile()
  wireSignOut()
  if (usingMock) console.info('[Freshman Map] mock mode — set API_BASE in src/api.js when CLOUD deploys')
</script>
</body>
</html>
