<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#16302a" />
<title>Freshman Map — CYCU</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet" />
<link href="./styles.css" rel="stylesheet" />
</head>
<body>

<div class="screen on" id="s-map">
  <div id="map"></div>
  <div class="hud topbar">
    <div class="badge">
      <div class="avatar">🐣</div>
      <div><div class="lvl">Lv 3 <small>生存中 · surviving</small></div><div class="xpbar"><i></i></div></div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn sos" id="sos" title="衛生紙 SOS">🧻</button>
    <button class="iconbtn" id="recenter" title="Back to me">🎯</button>
  </div>
  <div class="hud chips float" id="chips"></div>
</div>

<div class="screen" id="s-food">
  <div class="scroll">
    <div class="h1">美食 Food<small>中原夜市 · 就在校門口 right outside the gate</small></div>
    <div class="chips" id="fchips"></div>
    <div id="flist"></div>
  </div>
</div>

<div class="screen" id="s-buddy">
  <div class="scroll">
    <div class="h1">BuddyUp<small>一個人不好吃飯 · don't eat alone</small></div>
    <div id="blist"></div>
    <button class="btn ghost wide" id="newact">➕ 開一個新活動 Create activity</button>
  </div>
</div>

<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<nav class="nav">
  <button class="on" data-screen="s-map"><span>🗺️</span>地圖</button>
  <button data-screen="s-food"><span>🍜</span>美食</button>
  <button data-screen="s-buddy"><span>🤝</span>BuddyUp</button>
</nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
  import { initMap, resizeMap } from './src/map.js'
  import { initFood } from './src/food.js'
  import { initBuddy } from './src/buddy.js'
  import { campus, usingMock } from './src/api.js'

  document.title = `Freshman Map — ${campus.name}`

  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'))
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'))
    b.classList.add('on')
    document.getElementById(b.dataset.screen).classList.add('on')
    if (b.dataset.screen === 's-map') setTimeout(resizeMap, 50)
  })

  initMap(); initFood(); initBuddy()
  if (usingMock) console.info('[Freshman Map] mock mode — set API_BASE in src/api.js when CLOUD deploys')
</script>
</body>
</html>
